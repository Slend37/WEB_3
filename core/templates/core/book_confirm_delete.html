{% extends 'core/base.html' %}

{% block content %}
<div class="container">
    <h1>Удаление книги</h1>
    <p>Вы уверены, что хотите удалить книгу "{{ book.name }}"?</p>
    <p>Автор: {{ book.author.name }}</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Да, удалить</button>
        <a href="{% url 'book_detail' book.pk %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
