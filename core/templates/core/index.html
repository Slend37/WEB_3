{% extends 'core/base.html' %}

{% block content %}
{{ block.super }}
    <div class="container">
        <p>
            <h1>{{ title }}</h1>
        </p>
        <p>{{ welcome_text }}</p>
        <button type="button" class="btn btn-primary btn-lg">Начать</button>
        <button type="button" class="btn btn-primary btn-lg">Купить</button>
        <button type="button" class="btn btn-primary btn-lg">Читать</button>
        <a href="{% url 'book_create' %}" class="btn btn-success btn-lg">+ Добавить книгу</a>
    </div>

    <div class="container text-center">
        
        <div class="row">
            {% for item in books %}
            <div class="col">
                <div class="card" style="height: 30rem; width: 18rem; margin-top: 3rem; margin-bottom: 3rem">
                    <img src="https://placehold.co/300" class="card-img-top" alt="...">
                    <div class="card-body">
                        <h5 class="card-title">{{ item.name }}</h5>
                        <p class="card-text">{{ item.publish_year}}</p>
                        <h6 class="card-title">{{ item.author }}</h6>
                        <a href="{% url 'book_detail' pk=item.pk %}" class="btn btn-success">Подробнее</a>
                    </div>
                </div>      
            </div>
            {% endfor %}
        </div>
        
    </div>
    {% endblock %}
