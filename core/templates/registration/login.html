{% extends 'core/base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
<h2>Вход</h2>
<form method='post'>
    {% csrf_token %}
    {{ form.as_p }}
    <button type='submit'>Войти</button>
</form>
{% if error %}
    <div class='alert alert-danger' role='alert'>
        {{ error }}
    </div>
{% endif %}
{% endblock %}
